; PlatformIO 配置文件
; STM32F407VGT6 触摸屏项目

[env:stm32f407vgt6]
platform = ststm32
board = genericSTM32F407VGT6
framework = cmsis

; 上传工具：CMSIS-DAP
upload_protocol = cmsis-dap
upload_speed = 4000

; 调试工具：CMSIS-DAP
debug_tool = cmsis-dap

; 编译选项
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F407xx
    -DHSE_VALUE=8000000
    -IInc
    -ICore/Inc
    -IDrivers/STM32F4xx_HAL_Driver/Inc
    -IDrivers/CMSIS/Device/ST/STM32F4xx/Include
    -IDrivers/CMSIS/Include

; 源文件目录
src_filter = +<../Main/> +<../Common/> +<../USER/> +<../Startup_config/> +<../GUI/>
